<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="京大生専用の過去問、テスト対策情報共有、教科書の貸借マッチングサービス「京大InfoHub」。欲しい情報が手に入り、教科書も貸し借りできる、京大生のスマートな単位取得を強力にサポートするプラットフォームです。">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kyodai-info.web.app/">
  <meta property="og:title" content="京大InfoHub">
  <meta property="og:description" content="京大生専用の過去問、テスト対策情報共有、教科書の貸借マッチングサービス「京大InfoHub」。欲しい情報が手に入り、教科書も貸し借りできる、京大生のスマートな単位取得を強力にサポートするプラットフォームです。">
  <meta property="og:image" content="https://kyodai-info.web.app/favicon.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://kyodai-info.web.app/">
  <meta property="twitter:title" content="京大InfoHub">
  <meta property="twitter:description" content="京大生専用の過去問、テスト対策情報共有、教科書の貸借マッチングサービス「京大InfoHub」。欲しい情報が手に入り、教科書も貸し借りできる、京大生のスマートな単位取得を強力にサポートするプラットフォームです。">
  <meta property="twitter:image" content="https://kyodai-info.web.app/favicon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kyodai_info_hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>京大InfoHub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc;">
  <!-- Premium Loading Spinner -->
  <div id="loading-indicator" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: opacity 0.3s ease;">
    <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #0f4c81; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    <div style="margin-top: 20px; font-size: 16px; font-weight: bold; color: #1e293b;">京大InfoHub を読み込み中</div>
    <div style="margin-top: 6px; font-size: 12px; color: #64748b;">初回ロードには数秒かかる場合があります...</div>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // MutationObserver to fade out and remove the loader once Flutter adds its view
    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'CANVAS' || node.id === 'flutter-view') {
            const loader = document.getElementById('loading-indicator');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 300);
            }
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
