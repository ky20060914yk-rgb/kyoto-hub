<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>icon</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&family=Noto+Serif+JP:wght@900&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  .v { display: none; width: 1080px; height: 1080px; position: relative; align-items: center; justify-content: center; }
  .v.on { display: flex; }
  /* Instagram crops to a circle: keep everything inside the central ~860px. */
  .a { background: #0f4c81; }
  .a .k { font: 900 500px/1 'Noto Sans JP', sans-serif; color: #fff; transform: translate(-70px, 10px); }
  .a .p { position: absolute; left: 700px; top: 270px; font: 900 300px/1 'Noto Sans JP', sans-serif; color: #ffd479; }

  .b { background: #0f4c81; }
  .b .tile { width: 640px; height: 640px; border-radius: 150px; background: #fff; display: grid; place-items: center; position: relative; }
  .b .k { font: 900 430px/1 'Noto Sans JP', sans-serif; color: #0f4c81; }
  .b .p { position: absolute; right: -70px; top: -70px; width: 220px; height: 220px; border-radius: 999px; background: #ffd479; color: #0f4c81; display: grid; place-items: center; font: 900 200px/1 'Noto Sans JP', sans-serif; padding-bottom: 18px; }

  .c { background: #f9f7f6; }
  .c .k { font: 900 520px/1 'Noto Serif JP', serif; color: #0f4c81; transform: translate(-70px, 10px); }
  .c .p { position: absolute; left: 705px; top: 265px; font: 900 300px/1 'Noto Sans JP', sans-serif; color: #c98500; }
</style>
</head>
<body>
  <div class="v a" data-v="a"><span class="k">京</span><span class="p">+</span></div>
  <div class="v b" data-v="b"><div class="tile"><span class="k">京</span><span class="p">+</span></div></div>
  <div class="v c" data-v="c"><span class="k">京</span><span class="p">+</span></div>
  <script>document.querySelector(`[data-v="${location.search.slice(1) || 'a'}"]`).classList.add('on');</script>
</body>
</html>
