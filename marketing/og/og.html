<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #0f4c81; color: #fff; position: relative; padding: 72px 80px; -webkit-font-smoothing: antialiased; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 700; }
  .mark { width: 64px; height: 64px; border-radius: 18px; background: #fff; color: #0f4c81; display: grid; place-items: center; font-size: 36px; font-weight: 900; }
  h1 { margin-top: 56px; font-size: 76px; line-height: 1.25; font-weight: 900; }
  h1 em { font-style: normal; color: #ffd479; }
  .tags { position: absolute; left: 80px; bottom: 72px; display: flex; gap: 14px; }
  .tags span { padding: 12px 24px; border-radius: 999px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.25); font-size: 26px; font-weight: 700; }
  .ghost { position: absolute; right: -40px; bottom: -120px; font-size: 520px; font-weight: 900; line-height: 1; color: #fff; opacity: .07; }
  .free { position: absolute; right: 80px; top: 76px; font-size: 26px; font-weight: 700; padding: 10px 22px; border-radius: 999px; background: #ffd479; color: #0f4c81; }
</style>
</head>
<body>
  <div class="ghost">京</div>
  <div class="brand"><span class="mark">京</span>京大InfoHub</div>
  <span class="free">京大生は無料</span>
  <h1>その履修、<em>先輩の声</em>を<br>聞いてから決めよう。</h1>
  <div class="tags"><span>授業レビュー</span><span>楽単</span><span>過去問</span><span>時間割</span><span>教科書</span></div>
</body>
</html>
