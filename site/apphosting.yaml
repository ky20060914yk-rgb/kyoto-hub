# Firebase App Hosting (backend root directory: site/, region asia-east1).
# The backend itself is created by the owner in the console / CLI:
#   firebase apphosting:backends:create --project kyodai-sns --primary-region asia-east1 --root-dir site
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  - variable: NEXT_PUBLIC_SITE_URL
    # Where people land (kyodai-info.web.app 301-redirects here after cutover): canonical URLs + sitemap.
    value: https://kyodai-info--kyodai-sns.asia-east1.hosted.app
    availability: [BUILD, RUNTIME]
